name: design_system
description: Professional Flutter design system generated by Figma Make
version: 1.0.0
homepage: https://figma-make.com

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Responsive Design
  sizer: ^3.1.3
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic
