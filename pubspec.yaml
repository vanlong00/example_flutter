name: example
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  design_system:
    path: packages/design_system

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.8
  uuid: ^4.0.0
  path_provider: ^2.1.5
  name_plus: ^0.0.3
  path: ^1.9.1
  archive: ^4.0.7
  open_file: ^3.5.11
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  animated_tree_view: ^2.3.0
  receive_sharing_intent:
    git:
      url: https://github.com/KasemJaffer/receive_sharing_intent
      ref: 2cea396843cd3ab1b5ec4334be4233864637874e

  shared_preferences: ^2.5.3
  showcaseview: ^3.0.0
  permission_handler: ^12.0.1

  # Firebase
  firebase_core: ^4.5.0

  # BLoC State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # GetIt for Dependency Injection
  get_it: 
  injectable:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  build_runner:
  flutter_gen_runner:
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  injectable_generator:


flutter_gen:
  output: lib/gen/ # Optional (default: lib/gen/)
  line_length: 120 # Optional

  # Optional
  integrations:
    image: true
    # flutter_svg: true
    # rive: true
    # lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/Solid/
    - assets/icons/Regular/
    - assets/icons/Feat/
